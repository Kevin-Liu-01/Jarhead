name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app's jobs install what scripts/install.sh installs: the workspace without the site's
  # dependencies (decision D6). Only the site job installs those.
  typescript:
    name: typecheck + tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!./site'
      - run: pnpm run typecheck
      # Includes the real ad-hoc install (packages/install adhoc-install.test.ts: codesign into a
      # temp Applications folder, never /Applications) and install.sh against stubs.
      - run: pnpm test
      # The one-line installer: syntax, a dry run with its four commands (README's, the site's dependencies left out), what it never does.
      - run: sh site/scripts/check-install.sh

  swift:
    name: swift build (apps/mac + hands)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!./site'
      - run: pnpm build:hands
      - run: swift build --package-path apps/mac
      # The contract probe: the Model, UI and Console sources compiled with the probe's own
      # main, then the captured frames under Scripts/fixtures decoded as EngineClient would.
      # No window, no TCC, no daemon, no Live session, nothing read from ~/.jarhead.
      - run: bash apps/mac/Scripts/protocol-probe.sh
      # The wake gate under test: the real gate and passphrase code, the recogniser, the voice
      # and the owner sheet scripted, on a short clock, in a temp state dir. No mic, no sound, no sheet.
      - run: bash apps/mac/Scripts/wake-gate-check.sh
      # "Ask for everything" ends: the real sweep with its Mac side scripted; closing Setup stops the poll.
      # Nothing is asked or opened, and Setup's window is never shown.
      - run: bash apps/mac/Scripts/sweep-check.sh
      # The global hotkeys type nothing on the US layout (UCKeyTranslate); nothing is registered.
      - run: bash apps/mac/Scripts/hotkey-check.sh

  release:
    name: release build + sign (ad-hoc)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!./site'
      - run: pnpm build:hands
      # Icon, release build, stage, ad-hoc sign, strict verify — and stop: JARHEAD_BUILD_ONLY=1
      # never installs, so nothing under /Applications is touched on the runner.
      - run: JARHEAD_BUILD_ONLY=1 JARHEAD_SIGN_IDENTITY=- pnpm build:mac

  # The floor install.sh enforces: Swift 6.0 (the oldest Xcode 16) on macOS 14. The app's SwiftUI uses the
  # macOS 15 SDK (back-deployed to 14), so Xcode 15 never built it. The helper and the app must build here.
  swift-floor:
    name: swift build on the floor (macOS 14, the oldest Xcode 16)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: pick the oldest Xcode 16 on the runner
        run: |
          ls -d /Applications/Xcode_16*.app
          oldest="$(ls -d /Applications/Xcode_16*.app | sort -V | head -n 1)"
          echo "DEVELOPER_DIR=$oldest/Contents/Developer" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: xcrun swift --version
      - run: pnpm install --frozen-lockfile --filter '!./site'
      - run: pnpm build:hands
      - run: swift build --package-path apps/mac

  site:
    name: site (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C site typecheck
      - run: pnpm -C site build

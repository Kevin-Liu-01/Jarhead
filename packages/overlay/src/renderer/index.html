      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="overlay.css" />
    <title>jarvis</title>

    <div id="bubble" hidden></div>
    <script src="overlay.js"></script>
  </body>
</html>
